name: Heavy Build - Test

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      
      - name: Setup Node.js (WITH CACHE)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'  # ← THIS LINE MAKES IT FAST
      
      # Create the SAME package.json
      - name: Create package.json with heavy dependencies
        run: |
          cat > package.json << 'EOF'
          {
            "name": "heavy-build-demo",
            "version": "1.0.0",
            "scripts": {
              "build": "echo 'Building...' && sleep 10"
            },
            "dependencies": {
              "next": "^14.0.0",
              "react": "^18.2.0",
              "react-dom": "^18.2.0",
              "typescript": "^5.3.0",
              "@types/node": "^20.10.0",
              "@types/react": "^18.2.0",
              "webpack": "^5.89.0",
              "webpack-cli": "^5.1.0",
              "babel-loader": "^9.1.0",
              "@babel/core": "^7.23.0",
              "@babel/preset-env": "^7.23.0",
              "@babel/preset-react": "^7.23.0",
              "@babel/preset-typescript": "^7.23.0",
              "eslint": "^8.55.0",
              "eslint-config-next": "^14.0.0",
              "prettier": "^3.1.0",
              "jest": "^29.7.0",
              "@testing-library/react": "^14.1.0",
              "@testing-library/jest-dom": "^6.1.0",
              "axios": "^1.6.0",
              "lodash": "^4.17.21",
              "moment": "^2.29.4",
              "date-fns": "^2.30.0",
              "express": "^4.18.0",
              "cors": "^2.8.5",
              "dotenv": "^16.3.0",
              "uuid": "^9.0.0",
              "ramda": "^0.29.0",
              "chart.js": "^4.4.0",
              "d3": "^7.8.0",
              "three": "^0.159.0",
              "framer-motion": "^10.16.0",
              "tailwindcss": "^3.3.0",
              "autoprefixer": "^10.4.0",
              "postcss": "^8.4.0",
              "sass": "^1.69.0",
              "@emotion/react": "^11.11.0",
              "@emotion/styled": "^11.11.0",
              "styled-components": "^6.1.0",
              "zod": "^3.22.0",
              "prisma": "^5.7.0",
              "@prisma/client": "^5.7.0",
              "sharp": "^0.33.0",
              "pg": "^8.11.0",
              "mongodb": "^6.3.0",
              "redis": "^4.6.0"
            },
            "devDependencies": {
              "@types/lodash": "^4.14.0",
              "@types/uuid": "^9.0.0",
              "@types/express": "^4.17.0",
              "@typescript-eslint/eslint-plugin": "^6.13.0",
              "@typescript-eslint/parser": "^6.13.0",
              "nodemon": "^3.0.0",
              "ts-node": "^10.9.0",
              "concurrently": "^8.2.0"
            }
          }
          EOF
      
      # caching
      - name: Install dependencies (using cache)
        run: |
          echo "⚡ Installing packages from cache..."
          echo "This will only take 5-15 seconds!"
          npm install
          echo "✅ Installation complete (cached)!"
      
      # Same build steps but run much faster overall
      - name: Run TypeScript compilation
        run: |
          echo "Compiling TypeScript..."
          npx tsc --init
          sleep 15
          echo "TypeScript compilation done!"
      
      - name: Run ESLint
        run: |
          echo "Running ESLint..."
          sleep 10
          echo "Linting complete!"
      
      - name: Run tests
        run: |
          echo "Running test suite..."
          sleep 20
          echo "Tests passed!"
      
      - name: Build application
        run: |
          echo "Building production bundle..."
          npm run build
          sleep 15
          echo "Build complete!"
      
      - name: Generate documentation
        run: |
          echo "Generating documentation..."
          sleep 10
          echo "Documentation generated!"
      
      - name: Run final checks
        run: |
          echo "Running final checks..."
          sleep 10
          echo "All checks passed!"
      
