name: Carbon Demo Workflow

on:
  workflow_dispatch:  # Manual trigger

jobs:
  demo-job:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js (WITHOUT CACHE)
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          # NO cache here - this is the "before" version
      
      - name: Create package.json
        run: |
          cat > package.json << 'EOF'
          {
            "name": "demo",
            "version": "1.0.0",
            "dependencies": {
              "express": "^4.18.0",
              "lodash": "^4.17.21",
              "axios": "^1.6.0",
              "react": "^18.2.0",
              "react-dom": "^18.2.0"
            }
          }
          EOF
      
      - name: Install dependencies
        run: npm install
      
      - name: Simulate build
        run: |
          echo "Building application..."
          sleep 30
          echo "Build complete!"
